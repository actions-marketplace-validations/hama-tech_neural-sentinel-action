name: 'Neural Sentinel AI Security Scan'
description: 'Scan AI Agents (CrewAI, LangGraph, AutoGen) for security vulnerabilities and EU AI Act compliance in CI/CD.'
author: 'hama-tech'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  framework:
    description: 'The AI framework to scan (crewai, langgraph, autogen)'
    required: true
    default: 'crewai'
  test_script:
    description: 'Path to your Python script that builds and scans the agent'
    required: true
    default: 'tests/test_security.py'

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Neural Sentinel Plugin
      shell: bash
      run: |
        python -m pip install --upgrade pip
        echo "Installing agentsentinel-${{ inputs.framework }}..."
        pip install agentsentinel-${{ inputs.framework }}

    - name: Execute Security Scan
      shell: bash
      run: |
        echo "🛡️ Running Neural Sentinel on ${{ inputs.framework }}..."
        python ${{ inputs.test_script }}
